# WORKER PHỤ "WARMER" — quét Summary mỗi ngày 17:30 VN. ĐỘC LẬP với app chính (baocao-tiendo-pmo),
# dùng CHUNG KV namespace PMO_EDITS. Deploy 1 lần:  cd warmer && npx wrangler deploy
name = "baocao-tiendo-warmer"
main = "src/index.mjs"
compatibility_date = "2024-09-23"
# nodejs_compat — BẮT BUỘC, không phải tuỳ chọn. @cloudflare/puppeteer (dùng cho Browser Rendering
# ở tuBamNutGuiMail) import "node:buffer"; thiếu cờ này thì Cloudflare TỪ CHỐI nhận bản deploy:
#   Uncaught Error: No such module "node:buffer"  [code 10021]
# Đây là lý do thật khiến worker phụ nằm im chưa lên được, không phải chuyện quyền.
# Cờ này đòi compatibility_date >= 2024-09-23, đúng bằng ngày đang khai ở trên — đừng hạ xuống.
compatibility_flags = ["nodejs_compat"]

# HAI lịch (Cloudflare cron chạy theo UTC):
#  · "30 10 * * *" = 17:30 VN — warm Summary + sao lưu nhật ký giám sát.
#    PHẢI KHỚP mốc REFRESH_HOUR_VN/REFRESH_MIN_VN trong src/lib/mtld-install.functions.ts.
#  · "0 13 * * *" = 20:00 VN MỖI NGÀY — dựng PDF báo cáo tuân thủ vào Drive, nhưng src/index.mjs
#    CHỈ LÀM VÀO THỨ TƯ (tự kiểm thứ theo giờ VN). Trước đây lịch này ghi "30 13 * * 3" với ý
#    thứ Tư, mà Cloudflare đếm thứ theo 1=CHỦ NHẬT nên 3 = THỨ BA. Đo trên Drive: 4/4 file máy
#    dựng (08, 15, 22, 29/09) đều rơi THỨ BA 20:30, còn file thứ Tư mà trigger gửi mail cần thì
#    anh Tiến phải tự xuất tay. ĐỪNG neo thứ vào biểu thức cron nữa — kiểm trong code thì đúng
#    sai không phụ thuộc quy ước đếm thứ của Cloudflare.
[triggers]
#  · "30 16 * * *" = 23:30 VN — sao lưu NHẬT KÝ GIÁM SÁT ra Drive (cuối ngày làm việc, gom trọn
#    một ngày; app đọc mốc "Tất cả" từ file này cho nhẹ, xem fetchActivityFromDrive).
# ĐÚNG 5 LỊCH — gói Workers Free cho TỐI ĐA 5 cron trigger mỗi tài khoản (thử 6 thì Cloudflare từ
# chối thẳng, mã 10072). Vì thế warm ghép vào mốc 09:00 thay vì xin thêm một mốc riêng.
#
# BA lượt WARM mỗi ngày (09:00 · 14:30 · 17:30 VN), mỗi lượt 3 file (xem WARM_MOI_LUOT trong
# src/index.mjs) = 9 file/ngày → phủ hết danh sách trong 3 ngày, đúng bằng CACHE_TTL_S.
# Trước đây MỘT lượt x 6 file: chết CPU mỗi ngày từ 07/09 tới 13/09, đụng trần 2.010.000µs.
crons = [
  "0 2 * * *",      # 09:00 VN — ngày sửa cuối của link + camera công trường (KHÔNG warm nữa)
  "0 11 * * *",     # 18:00 VN — warm Summary (lô 1). Mốc làm mới thứ nhất của app.
  "0 13 * * *",     # 20:00 VN — warm Summary (lô 2) + THỨ TƯ dựng PDF tuân thủ. Mốc thứ hai.
  "30 16 * * *",    # 23:30 VN — sao lưu nhật ký giám sát + TOÀN BỘ dữ liệu KV + vân tay nguồn
]

# TRÌNH DUYỆT TRÊN MÂY (Browser Rendering). Cần vì nút "Cập nhật bản gửi mail" của app dựng PDF
# bằng cách CHỤP GIAO DIỆN — Worker không chụp được. Warmer mở app bằng trình duyệt này rồi để
# chính app chạy đúng hàm của nút đó, nên không có renderer thứ hai để lệch nhau.
[browser]
binding = "MYBROWSER"

# CẦN THÊM 1 SECRET: npx wrangler secret put RENDER_TOKEN  (phải TRÙNG chuỗi đặt trên app chính)

# KV DÙNG CHUNG với app chính — id lấy từ scripts/patch-wrangler.cjs của app chính.
# GOI THANG SANG APP CHINH (Service Binding).
# Worker goi worker khac qua URL cong khai thi Cloudflare tu choi: error code 1042. Service
# binding di thang trong mang noi bo, khong qua Internet, va app van co ngan sach subrequest
# rieng cua no. Day la duong de cron 18:00/20:00 bam nut "tu cham tuan thu" ben app.
[[services]]
binding = "APP"
service = "baocao-tiendo-pmo"

[[kv_namespaces]]
binding = "PMO_EDITS"
id = "2bdbce7b49014e538ee3156728ab9548"

# D1 DÙNG CHUNG với app chính (nhật ký giám sát) — để cron tự sao lưu access_log ra Drive.
# id lấy từ scripts/patch-wrangler.cjs của app chính (D1_LOG.database_id).
[[d1_databases]]
binding = "PMO_LOG"
database_name = "pmo-audit"
database_id = "ea3aca84-e754-44fb-947f-ca442b3f7b19"

# CẦN 3 SECRET cho Drive (chạy 1 lần trong thư mục warmer):
#   npx wrangler secret put GDRIVE_OAUTH_CLIENT_ID
#   npx wrangler secret put GDRIVE_OAUTH_CLIENT_SECRET
#   npx wrangler secret put GDRIVE_OAUTH_REFRESH
# (dán đúng 3 giá trị đang có trong .env của app chính). Tuỳ chọn: GDRIVE_ROOT nếu đổi folder gốc.
